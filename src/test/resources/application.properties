spring.application.name=dlabogados-backend-test
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

app.jwt.secret=DLAbogadosSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHS256Algorithm2026Test
app.jwt.expiration-ms=86400000

app.upload.dir=./uploads/test

app.payment.provider=MERCADOPAGO
app.payment.mercadopago.access-token=TEST-TOKEN
app.payment.mercadopago.public-key=TEST-KEY
app.payment.success-url=http://localhost:4200/success
app.payment.failure-url=http://localhost:4200/failure
