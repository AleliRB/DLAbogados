# Configuracion general de DLAbogados Backend
spring.application.name=dlabogados-backend

# Puerto e interfaz de red para Render
server.port=${PORT:10000}
server.address=0.0.0.0

# Graceful shutdown para evitar cortar conexiones bruscamente en Render
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# DataSource y Aiven MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dl_abogados?serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optimizacion HikariCP para Aiven y Render (ahorro de memoria y prevencion de bloqueo)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.pool-name=DLAbogadosHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Evitar ejecucion automatica de schema.sql en produccion
spring.sql.init.mode=never

# Carga de archivos y limites de servlet
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=./uploads/documentos

# Seguridad y JWT
app.jwt.secret=${JWT_SECRET:DLAbogadosSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHS256Algorithm2026}
app.jwt.expiration-ms=86400000

# Configuracion de Pasarela de Pagos (Mercado Pago / Culqi)
app.payment.provider=${PAYMENT_PROVIDER:MERCADOPAGO}
app.payment.mercadopago.access-token=${MP_ACCESS_TOKEN:TEST-482910481048-091024-testkey}
app.payment.mercadopago.public-key=${MP_PUBLIC_KEY:TEST-df839120-testkey}
app.payment.success-url=http://localhost:4200/cliente/citas?payment=success
app.payment.failure-url=http://localhost:4200/cliente/citas?payment=failure